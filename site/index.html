<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>DCTI-Institute</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #fff;
    --text: #1b2430;
    --muted: #4a5563;      /* 7.6:1 on white, 7.1:1 on --bg */
    --faint: #66717f;      /* "No data yet": 4.9:1 on white */
    --line: #d6dde6;
    --accent: #1f5fa8;     /* main accent (blue) */
    --accent-soft: #e9f1fb;
    /* box tones: never red, yellow or green (reserved for status) */
    --tone-how: #1f5fa8;   --tone-how-soft: #e6effa;
    --tone-exec: #5a45c2;  --tone-exec-soft: #eeebfb;
    --tone-change: #1a6585; --tone-change-soft: #e4f1f6;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 6px 20px rgba(16, 24, 40, 0.06);
    --section-gap: 60px;
    --card-gap: 24px;
    --card-pad: 30px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem; line-height: 1.6;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 40px 72px; }
  h1, h2, h3 { line-height: 1.25; margin: 0; }
  h2 { font-size: 1.05rem; font-weight: 650; }
  h3 { font-size: 0.95rem; font-weight: 650; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .visually-hidden {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- header */
  .site-header {
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 20px 40px;
  }
  .brand { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .site-header h1 { font-size: 2rem; font-weight: 750; letter-spacing: -0.01em; margin-top: 6px; }
  .meta { margin-top: 8px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 1rem; }
  .meta strong { color: var(--text); font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-top: 4px; }
  .control-label { font-size: 0.8125rem; color: var(--muted); margin-right: 6px; }
  /* week selector: small and quiet */
  select {
    font: inherit; font-size: 0.875rem; color: var(--muted); background: transparent; min-height: 32px;
    border: 1px solid transparent; border-radius: 8px; padding: 2px 4px; cursor: pointer;
  }
  select:not(:disabled):hover { border-color: var(--line); background: #fff; }
  select:disabled { opacity: 1; cursor: default; -webkit-appearance: none; appearance: none; }
  /* language: the prominent control */
  .lang-group { display: inline-flex; padding: 4px; gap: 4px; background: #fff; border-radius: 12px; box-shadow: var(--shadow); }
  .lang-group button {
    font: inherit; font-size: 0.9375rem; font-weight: 650; min-height: 40px; min-width: 64px; padding: 6px 14px;
    background: transparent; color: var(--text); border: 0; border-radius: 9px; cursor: pointer;
  }
  .lang-group button:hover { background: var(--accent-soft); }
  .lang-group button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  /* sample data: visible, but quiet */
  .sample-banner { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--muted); }
  .sample-banner [aria-hidden] { color: #8a6300; }
  .notice {
    margin-top: 32px; padding: 18px 22px; background: #fde8e8;
    color: #7a1616; border-radius: var(--radius);
  }
  .notice p + p { margin-top: 6px; }
  .notice-info { background: #fff8e1; color: #5b3d00; }

  /* ---------- sections and cards */
  section, .main-section { margin-top: var(--section-gap); }
  .section-title {
    font-size: 0.8125rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 16px;
  }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--card-pad); }

  /* strategy band: 3 columns */
  .strategy-band { margin-top: 48px; }
  .strategy-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 40px; }
  .strategy-item h3 { font-size: 1.0625rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .strategy-item p { color: var(--text); font-size: 1rem; line-height: 1.6; }
  /* 3 lines, cut without "…": the last line fades out */
  .clamp { max-height: calc(1.6em * 3); overflow: hidden; }
  .clamp.is-cut { -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 100%); mask-image: linear-gradient(to bottom, #000 62%, transparent 100%); }
  .clamp.expanded { max-height: none; -webkit-mask-image: none; mask-image: none; }
  .more-btn {
    font: inherit; font-size: 0.875rem; font-weight: 650; color: var(--accent); background: none;
    border: 0; padding: 4px 0; margin-top: 6px; min-height: 32px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  /* the 3 boxes: How it's going leads */
  .boxes { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--card-gap); align-items: stretch; }
  .box { --tone: var(--tone-how); --tone-soft: var(--tone-how-soft); position: relative; overflow: hidden; }
  .box::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--tone); }
  .box-exec { --tone: var(--tone-exec); --tone-soft: var(--tone-exec-soft); }
  .box-change { --tone: var(--tone-change); --tone-soft: var(--tone-change-soft); }
  .box-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .box-icon { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: var(--tone-soft); color: var(--tone); flex: none; }
  .box h2 { font-size: 1.25rem; font-weight: 700; }
  .box-how h2 { font-size: 1.375rem; }
  .lines li { padding-left: 18px; position: relative; }
  .lines li + li { margin-top: 14px; }
  .lines li::before { content: ""; position: absolute; left: 0; top: 0.66em; width: 7px; height: 7px; border-radius: 50%; background: var(--tone, var(--accent)); }
  .box .lines { font-size: 1.0625rem; line-height: 1.6; }
  .box-how .lines { font-size: 1.125rem; }
  .box-status { margin-bottom: 18px; }
  .forced-note { margin-top: -8px; margin-bottom: 16px; font-size: 0.9375rem; color: var(--muted); }
  .forced-note strong { color: var(--text); }
  .how-stats { margin-top: 18px; font-size: 0.9375rem; }
  .how-stats p + p { margin-top: 4px; }
  .how-count { font-weight: 650; }
  .how-bar { margin-top: 12px; }
  .how-bar-head { display: flex; justify-content: space-between; gap: 12px; font-size: 0.875rem; }
  .how-bar-head strong { font-variant-numeric: tabular-nums; }
  .how-bar-track { margin-top: 4px; height: 8px; border-radius: 999px; background: #e6ebf1; overflow: hidden; }
  .how-bar-fill { display: block; height: 100%; background: var(--tone-how); }
  .how-diff { margin-top: 10px; font-weight: 650; }
  .needs-person { display: block; }
  .more { margin-top: 16px; }
  .more > summary { display: inline-block; font-size: 0.875rem; font-weight: 650; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }
  .more > .lines { margin-top: 12px; }

  /* needs from the team: one strip */
  .needs {
    margin-top: 32px; display: flex; align-items: center; gap: 14px; padding: 16px 24px;
    background: var(--accent-soft); color: var(--text); border-radius: 14px;
  }
  .needs .i { color: var(--accent); }
  .needs-body { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
  .needs h2 { font-size: 1rem; font-weight: 700; white-space: nowrap; }
  .needs h2::after { content: ":"; }

  /* ---------- status / badges */
  .status {
    display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: 0.875rem;
    border: 1px solid; border-radius: 999px; padding: 2px 10px 2px 6px; white-space: nowrap;
  }
  .status .icon {
    display: inline-flex; align-items: center; justify-content: center; width: 1.25em; height: 1.25em;
    border-radius: 50%; font-size: 0.8em; font-weight: 800; color: #fff;
  }
  .status-large { font-size: 1.5rem; gap: 10px; padding: 8px 20px 8px 10px; }
  .status-large .icon { width: 1.4em; height: 1.4em; font-size: 0.75em; }
  .st-green  { background: #e7f5ec; color: #14532d; border-color: #9fd3b2; }
  .st-green .icon  { background: #1f7a43; }
  .st-yellow { background: #fff5d6; color: #5f4200; border-color: #e6c66a; }
  .st-yellow .icon { background: #8a6300; }
  .st-red    { background: #fde8e8; color: #8b1a1a; border-color: #f1a7a7; }
  .st-red .icon    { background: #b42323; }
  .st-gray   { background: #eef1f4; color: #39424e; border-color: #c9d1da; }
  .st-gray .icon   { background: #5d6875; }
  .badge {
    display: inline-block; font-size: 0.8125rem; font-weight: 600; border-radius: 6px; padding: 1px 8px;
    border: 1px solid var(--line); background: #fff; color: var(--muted); white-space: nowrap;
  }
  .badge-provisional { border-style: dashed; border-color: #8a6300; color: #5f4200; background: #fff; }
  .tr-automated { background: var(--accent-soft); border-color: #9cbde3; color: #174a85; }
  .tr-manual { background: #fff; border-color: #8a97a8; color: var(--text); }
  .tr-not_yet { background: #fff; border-color: #c9d1da; color: #4a5563; }

  /* ---------- main funnel: one card per product, 3 steps in sequence */
  .products { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--card-gap); }
  .product-card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 22px; }
  .steps { display: flex; flex-direction: column; }
  .step { display: flex; flex-direction: column; position: relative; }
  .step + .step { margin-top: 40px; }
  /* arrow between steps: decorative (the ordered list already says "in sequence") */
  .step + .step::before {
    content: "↓"; content: "↓" / ""; position: absolute; top: -31px; left: 2px;
    font-size: 1.1rem; line-height: 1; color: #7b8794;
  }
  .step-top { order: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .step-label { order: 2; font-size: 0.8125rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .step .value { font-size: 2.625rem; font-weight: 750; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .step .no-data { display: flex; align-items: center; min-height: 2.9rem; margin: 0; font-size: 1.0625rem; color: var(--faint); font-style: italic; }
  .step .cell-badges { display: inline-flex; }
  .products > .card:only-child:not(.product-card) { grid-column: 1 / -1; }
  .products-empty { color: var(--faint); font-style: italic; }
  .lines li.empty { padding-left: 0; color: var(--faint); }
  .lines li.empty::before { display: none; }

  /* ---------- details (collapsed by default, never printed) */
  .details { margin-top: 64px; }
  .details > summary {
    display: inline-block; cursor: pointer; padding: 8px 0; font-size: 0.9375rem; font-weight: 600; color: var(--muted);
  }
  .details > summary::before { content: "▸"; content: "▸" / ""; display: inline-block; width: 1.1em; }
  .details[open] > summary::before { content: "▾"; content: "▾" / ""; }
  .details > summary::-webkit-details-marker { display: none; }
  .details > summary:hover { color: var(--accent); }
  .details > section:first-of-type { margin-top: 24px; }
  .details section { margin-top: 40px; }

  /* ---------- full funnel table (details) */
  .table-scroll { overflow-x: auto; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; min-width: 880px; }
  caption { text-align: left; padding: 16px 18px 0; color: var(--muted); font-size: 0.9rem; }
  th, td { text-align: left; vertical-align: top; padding: 12px 14px; border-top: 1px solid #e6ebf1; }
  thead th { font-size: 0.85rem; color: var(--muted); font-weight: 650; border-top: 0; padding-top: 10px; }
  tbody th { font-weight: 700; white-space: nowrap; }
  td + td, th + td, td + th { border-left: 1px solid #eef2f6; }
  .value { display: block; font-size: 1.45rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .change { display: block; font-size: 0.85rem; color: var(--muted); margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .change .arrow { font-weight: 700; color: var(--text); }
  .no-data { display: block; color: var(--faint); font-style: italic; margin-bottom: 6px; }
  .cell-badges { display: flex; flex-wrap: wrap; gap: 4px; }

  /* ---------- pillars (details) */
  .pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--card-gap); }
  .pillar { padding: 24px; }
  .pillar h3 { font-size: 1rem; margin-bottom: 12px; }
  .pillar-item + .pillar-item { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e6ebf1; }
  .pillar-item .name { font-weight: 600; font-size: 0.95rem; line-height: 1.4; }
  .pillar-item .kpi { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 4px; }
  .pillar-item .kpi-name { color: var(--muted); font-size: 0.9rem; }
  .pillar-item .kpi-value { font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  /* ---------- hours by task (details; read-only, live from /api/timelog-public) */
  .hours-card { padding: 8px 0 4px; }
  .hours-card .hours-msg { padding: 14px 22px; color: var(--muted); }
  table.hours-table { min-width: 0; }
  .hours-table th, .hours-table td { padding: 9px 22px; }
  .hours-table .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hours-table tbody th { font-weight: 500; white-space: normal; }
  .hours-table th.group-row { font-size: 0.8125rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 16px; }
  .hours-table tfoot th, .hours-table tfoot td { font-weight: 700; border-top: 2px solid #d6dde6; }
  .hours-table .zero { color: var(--faint); }
  .hours-tag { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 650; background: #eef1f5; color: var(--muted); }
  .hours-note { margin-top: 8px; font-size: 0.875rem; color: var(--muted); }

  /* ---------- process health (details) */
  .health { display: flex; flex-wrap: wrap; gap: 12px 40px; margin-top: 40px; }
  .health h2 { width: 100%; }
  .health-item .k { color: var(--muted); font-size: 0.9rem; display: block; }
  .health-item .v { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .health-item .detail { color: var(--muted); font-size: 0.9rem; margin-left: 6px; }

  /* ---------- responsive */
  @media (max-width: 1000px) {
    .boxes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .box-how { grid-column: 1 / -1; }
    .products { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pillars { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    :root { --section-gap: 48px; --card-pad: 24px; --card-gap: 18px; }
    .wrap { padding: 28px 20px 56px; }
    .strategy-grid { grid-template-columns: 1fr; gap: 24px; }
    .boxes, .products { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 24px 16px 48px; }
    .site-header h1 { font-size: 1.625rem; }
    .strategy-band { margin-top: 36px; }
    .status-large { font-size: 1.25rem; }
    .needs { padding: 14px 18px; align-items: flex-start; }
    .pillars { grid-template-columns: 1fr; }
    #funnel-table tbody th, #funnel-table thead th:first-child { position: sticky; left: 0; z-index: 1; background: #fff; box-shadow: 1px 0 0 var(--line); white-space: normal; min-width: 110px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  /* ---------- print: one A4 landscape page */
  /* Main screen only, in the active language. If it ever spills to a 2nd page, cut spacing here, never font sizes. */
  @page { size: A4 landscape; margin: 9mm 10mm; }
  /* discreet link to the time log screen (horas.html) */
  .timelog-link { margin-top: 48px; text-align: right; font-size: 0.8125rem; }
  .timelog-link a { color: var(--faint); text-underline-offset: 3px; }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* the print viewport can match the narrow-screen rules: pin the paper layout here */
    :root { --shadow: none; --section-gap: 3.5mm; --card-gap: 3.5mm; --card-pad: 3mm; }
    html, body { background: #fff; font-size: 10.5pt; line-height: 1.32; }
    .site-header h1 { font-size: 17pt; }
    .strategy-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
    .boxes { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) !important; }
    .products { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
    .status-large { font-size: 13pt !important; }
    .needs { align-items: center !important; }
    .controls, .details, .more, .more-btn, .timelog-link, noscript { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .card, .table-scroll { box-shadow: none; border: 1px solid #c9d1da; border-radius: 8px; padding: 3mm 4.5mm; }
    .site-header h1 { font-size: 17pt; margin-top: 0.5mm; }
    .meta { margin-top: 1mm; font-size: 10pt; }
    .sample-banner { margin-top: 0.5mm; }
    section, .main-section { margin-top: 3.5mm; }
    .section-title { margin-bottom: 1.5mm; }
    .strategy-band { margin-top: 2.5mm; }
    .strategy-grid { gap: 0 6mm; }
    .strategy-item h3 { margin-bottom: 0.5mm; }
    .strategy-item p { font-size: 10pt; line-height: 1.32; }
    /* paper has no "see more": print the full strategy text (it fits; never cut a sentence) */
    .clamp, .clamp.expanded, .clamp.is-cut { max-height: none; overflow: visible; -webkit-mask-image: none; mask-image: none; }
    .boxes { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4mm; }
    .box-how { grid-column: auto; }
    .box { break-inside: avoid; padding-top: 4mm; }
    .box::before { height: 1.2mm; }
    .box-head { margin-bottom: 2mm; gap: 2.5mm; }
    .box-icon { width: 8mm; height: 8mm; border-radius: 2.5mm; }
    .box-icon svg.i { width: 4.6mm; height: 4.6mm; }
    .box h2 { font-size: 13pt; }
    .box-how h2 { font-size: 13.5pt; }
    .box .lines, .box-how .lines { font-size: 10.5pt; line-height: 1.35; }
    .lines li + li { margin-top: 1.2mm; }
    .box-status { margin-bottom: 2mm; }
    .status-large { font-size: 13pt; padding: 1mm 4mm 1mm 1.5mm; }
    .needs { margin-top: 3mm; padding: 1.6mm 4mm; border-radius: 8px; }
    .products { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4mm; }
    .product-card { break-inside: avoid; }
    .product-card h3 { font-size: 12pt; margin-bottom: 2mm; }
    /* on paper the 3 steps sit side by side */
    .steps { flex-direction: row; gap: 5mm; }
    .step { flex: 1 1 0; min-width: 0; }
    .step + .step { margin-top: 0; }
    .step + .step::before { content: "→"; content: "→" / ""; top: 1.6mm; left: -4.2mm; font-size: 10pt; }
    .step .value { font-size: 19pt; }
    .step .no-data { min-height: 0; font-size: 10pt; height: 19pt; }
    .step-label { font-size: 9pt; margin-top: 0.5mm; line-height: 1.25; }
    .step-top { gap: 1mm 2mm; }
    .status, .badge { font-size: 8.5pt; }
    /* task format (kpi.tasks): taller boxes; tighten so the funnel stays on page 1 */
    .has-tasks .strategy-item p { font-size: 9.5pt; line-height: 1.28; }
    .has-tasks section, .has-tasks .main-section { margin-top: 2.5mm; }
    .has-tasks .box .lines, .has-tasks .box-how .lines { font-size: 9.5pt; line-height: 1.28; }
    .has-tasks .lines li + li { margin-top: 0.8mm; }
    .has-tasks .box-head { margin-bottom: 1.5mm; }
    .has-tasks .box-status { margin-bottom: 1.5mm; }
    .has-tasks .forced-note { margin: 0 0 1.5mm; font-size: 9pt; }
    .has-tasks .how-stats { margin-top: 2mm; font-size: 9.5pt; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 5mm; }
    .has-tasks .how-stats > p { grid-column: 1 / -1; }
    .has-tasks .how-stats p + p { margin-top: 0.5mm; }
    .has-tasks .how-bar { margin-top: 1mm; }
    .has-tasks .how-bar-head { font-size: 9pt; }
    .has-tasks .how-bar-track { margin-top: 0.6mm; height: 1.6mm; }
    .has-tasks .how-diff { margin-top: 1.2mm; }
    .has-tasks .needs { margin-top: 2.5mm; padding: 1.2mm 4mm; }
    .has-tasks .needs-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 2.5mm; }
    .has-tasks .needs-body, .has-tasks .needs h2 { font-size: 9.5pt; }
    .has-tasks .product-card { padding-top: 2.5mm; padding-bottom: 2.5mm; }
    .has-tasks .product-card h3 { margin-bottom: 1mm; }
    .has-tasks .step .value { font-size: 17pt; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div>
      <div class="brand">DCTI-Institute</div>
      <h1 id="page-title"></h1>
      <p class="meta"><span id="week-line"></span><span id="snapshot-line"></span></p>

  <main id="main" aria-busy="true">

      <div class="main-section">

            </div>
            <div class="box-status" id="box-how-status"></div>

            <ul class="lines" id="box-how"></ul>
            <div id="box-how-more"></div>
            <div class="how-stats" id="box-how-tasks" hidden></div>
          </article>
          <article class="card box box-exec" aria-labelledby="box-executing-title">
            <div class="box-head">
              <span class="box-icon" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></svg></span>

            <ul class="lines" id="box-executing"></ul>

            <div class="box-head">
              <span class="box-icon" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" focusable="false"><path d="M4 11a8 8 0 0 1 14-4.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 13a8 8 0 0 1-14 4.6L4 15"/><path d="M4 20v-5h5"/></svg></span>

      <section class="main-funnel" aria-labelledby="main-funnel-title">

      <!-- details: collapsed by default, never printed -->
      <details class="details" id="details">
        <summary id="details-summary"></summary>

        <section aria-labelledby="funnel-title">

        <section aria-labelledby="pillars-title">

        <section aria-labelledby="hours-title" id="hours-section">

            <p class="hours-msg" id="hours-msg" role="status"></p>
            <table class="hours-table" id="hours-table" hidden>
              <thead><tr><th scope="col" id="hours-h-task"></th><th scope="col" class="num" id="hours-h-week"></th><th scope="col" class="num" id="hours-h-total"></th></tr></thead>
              <tbody id="hours-body"></tbody>

  <noscript>
    <p class="notice" lang="en-CA">This dashboard needs JavaScript to show the data.</p>
    <p class="notice" lang="pt-BR">Este painel precisa de JavaScript para mostrar os dados.</p>
  </noscript>
</div>

<script>
(function () {
  'use strict';

  // The only fixed texts in the script are error messages, in both languages.
  var MSG = {
    load: {
      'en-CA': 'The dashboard data could not be loaded. Please try again later.',
      'pt-BR': 'Não foi possível carregar os dados do painel. Tente novamente mais tarde.'
    },
    file: {
      'en-CA': 'This page must be opened through a web server (for example: python3 -m http.server inside the site folder). It does not work from file://.',
      'pt-BR': 'Esta página precisa ser aberta por um servidor web (por exemplo: python3 -m http.server dentro da pasta site). Ela não funciona via file://.'
    },
    week: {
      'en-CA': 'The selected week could not be loaded. Showing the previous selection.',
      'pt-BR': 'Não foi possível carregar a semana escolhida. Mantida a seleção anterior.'
    },
    week_missing: {
      'en-CA': 'The week in the link ({week}) is not available. Showing the most recent week.',
      'pt-BR': 'A semana do link ({week}) não está disponível. Mostrando a semana mais recente.'
    }
  };
  // Interface texts that ui_labels does not have (yet). If the key is added to ui_labels, the sheet wins.
  var UI = {
    'label.see_more':    { 'en-CA': 'See more', 'pt-BR': 'Ver mais' },
    'label.see_less':    { 'en-CA': 'See less', 'pt-BR': 'Ver menos' },
    'label.see_details': { 'en-CA': 'See details', 'pt-BR': 'Ver detalhes' },
    'label.time_log':    { 'en-CA': 'Time log', 'pt-BR': 'Registro de horas' },
    'label.hours_by_task':     { 'en-CA': 'Hours by task', 'pt-BR': 'Horas por tarefa' },
    'label.hours_task':        { 'en-CA': 'Task', 'pt-BR': 'Tarefa' },
    'label.hours_week':        { 'en-CA': 'This week ({date})', 'pt-BR': 'Esta semana ({date})' },
    'label.hours_to_date':     { 'en-CA': 'To date', 'pt-BR': 'Acumulado' },
    'label.hours_sum':         { 'en-CA': 'Total', 'pt-BR': 'Total' },
    'label.hours_fixed':       { 'en-CA': 'Meetings and extras', 'pt-BR': 'Reuniões e extras' },
    'label.hours_other':       { 'en-CA': 'Other', 'pt-BR': 'Outras' },
    'label.hours_loading':     { 'en-CA': 'Loading…', 'pt-BR': 'Carregando…' },
    'label.hours_unavailable': { 'en-CA': 'Unavailable right now.', 'pt-BR': 'Indisponível no momento.' },
    'label.hours_none':        { 'en-CA': 'No hours logged yet.', 'pt-BR': 'Nenhuma hora registrada ainda.' },
    'label.hours_paused':      { 'en-CA': 'paused', 'pt-BR': 'pausada' },
    'label.hours_finished':    { 'en-CA': 'finished', 'pt-BR': 'concluída' },
    'label.hours_note':        { 'en-CA': 'Read-only. "To date" = all hours since the log started.', 'pt-BR': 'Somente leitura. "Acumulado" = todas as horas desde o início do registro.' },
    'label.tasks_this_week':   { 'en-CA': 'This week', 'pt-BR': 'Esta semana' },
    'label.tasks_next_week':   { 'en-CA': 'Next week', 'pt-BR': 'Próxima semana' },
    'label.tasks_none':        { 'en-CA': 'Nothing to list.', 'pt-BR': 'Nada a listar.' },
    'label.task_blocked':      { 'en-CA': 'Blocked', 'pt-BR': 'Bloqueada' },
    'label.task_late':         { 'en-CA': 'Late since {date}', 'pt-BR': 'Atrasada desde {date}' },
    'label.task_due':          { 'en-CA': 'due {date}', 'pt-BR': 'prazo {date}' },
    'label.task_no_due':       { 'en-CA': 'no due date', 'pt-BR': 'sem prazo' },
    'label.forced_reason':     { 'en-CA': 'Reason', 'pt-BR': 'Motivo' },
    'label.forced_rule':       { 'en-CA': 'rule: {color}', 'pt-BR': 'regra: {color}' },
    'label.cycle_progress':    { 'en-CA': '{x} of {y} in the cycle', 'pt-BR': '{x} de {y} do ciclo' },
    'label.late_one':          { 'en-CA': '{n} late', 'pt-BR': '{n} atrasada' },
    'label.late_many':         { 'en-CA': '{n} late', 'pt-BR': '{n} atrasadas' },
    'label.gtm_done':          { 'en-CA': 'Original GTM plan completed', 'pt-BR': 'GTM original concluído' },
    'label.gtm_expected':      { 'en-CA': 'Expected by {date}', 'pt-BR': 'Previsto até {date}' },
    'label.gtm_ahead':         { 'en-CA': '{n} points ahead', 'pt-BR': 'adiantado {n} pontos' },
    'label.gtm_behind':        { 'en-CA': '{n} points behind', 'pt-BR': 'atrasado {n} pontos' },
    'label.gtm_on_plan':       { 'en-CA': 'On plan', 'pt-BR': 'em dia' },
    'label.meeting_title':     { 'en-CA': 'From meetings', 'pt-BR': 'De reuniões' },
    'label.meeting_new_one':   { 'en-CA': '+{n} new', 'pt-BR': '+{n} nova' },
    'label.meeting_new_many':  { 'en-CA': '+{n} new', 'pt-BR': '+{n} novas' },
    'label.meeting_done_one':  { 'en-CA': '{n} completed', 'pt-BR': '{n} concluída' },
    'label.meeting_done_many': { 'en-CA': '{n} completed', 'pt-BR': '{n} concluídas' }
  };
  var MAX_BOX_ITEMS = 3;
  // Main screen: sales-focused funnel (technical stage keys from kpi.funnel[].stage)
  var MAIN_STAGES = ['Site visits', 'Demo/Trial request', 'Sale (revenue)'];
  var TARGET_STATUSES = ['Green', 'Yellow', 'Red'];   // Gray = no target: the main table shows no badge
  var LANGS = ['en-CA', 'pt-BR'];
  var COL = { 'en-CA': 'en_CA', 'pt-BR': 'pt_BR' };
  var STATUS_ICON = { Green: '✓', Yellow: '!', Red: '✕', Gray: '–' };
  var PILLAR_GROUPS = ['Content', 'External authority', 'Lead capture', 'Community'];
  var DASH = '—';
  var FILE_RE = /^[A-Za-z0-9_.-]+\.json$/;
  var WEEK_RE = /^\d{4}-\d{2}-\d{2}$/;

  // notice = { kind, vars } shown above the content; re-rendered when the language changes
  var state = { lang: null, data: null, weeks: [], file: null, missing: {}, notice: null };

  // ---------- small helpers
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function isObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }
  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function str(x) { return (x === null || x === undefined) ? '' : String(x); }
  function slug(s) { return str(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
  function normLang(x) {
    var s = str(x).trim().toLowerCase();
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].toLowerCase() === s) return LANGS[i];
    return null;
  }
  function param(name) {
    try { return new URLSearchParams(window.location.search).get(name); } catch (e) { return null; }
  }
  function store(key, val) { try { window.localStorage.setItem(key, val); } catch (e) { /* no storage */ } }
  function read(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }

  // label lookup: L(key) -> text in the active language, or a dash when the key is missing
  function labelOr(key, fallback) {
    var labels = state.data && isObj(state.data.labels) ? state.data.labels : {};
    var row = labels[key];
    var v = isObj(row) ? str(row[COL[state.lang]]).trim() : '';
    if (v) return v;
    state.missing[key] = true;
    return fallback;
  }
  function L(key) { return labelOr(key, DASH); }
  function uiText(key) {   // ui_labels first, then the built-in text (no "missing" warning)
    var labels = state.data && isObj(state.data.labels) ? state.data.labels : {};
    var v = isObj(labels[key]) ? str(labels[key][COL[state.lang]]).trim() : '';
    return v || (UI[key] ? UI[key][state.lang] : DASH);
  }
  function fill(template, values) {
    return template.replace(/\{(\w+)\}/g, function (m, k) { return values[k] !== undefined ? values[k] : m; });
  }
  function aiText(obj, base) {   // AI text columns: <base>_en_CA / <base>_pt_BR
    return isObj(obj) ? str(obj[base + '_' + COL[state.lang]]).trim() : '';
  }

  // ---------- formatting (Intl)
  function fmtNumber(v, unit, signed) {
    if (!isNum(v)) return DASH;
    var opts = { maximumFractionDigits: 1 };
    if (unit && unit !== 'count') { opts = { style: 'currency', currency: unit, maximumFractionDigits: 0 }; }
    if (signed) opts.signDisplay = 'exceptZero';
    try { return new Intl.NumberFormat(state.lang, opts).format(v); }
    catch (e) { return String(v); }
  }
  function fmtPct(v) {
    if (!isNum(v)) return '';
    try { return new Intl.NumberFormat(state.lang, { maximumFractionDigits: 1, signDisplay: 'exceptZero' }).format(v) + '%'; }
    catch (e) { return String(v) + '%'; }
  }
  function parseDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str(iso));
    return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
  }
  function fmtDate(iso, opts) {
    var d = parseDate(iso);
    if (!d) return DASH;
    try { return new Intl.DateTimeFormat(state.lang, Object.assign({ timeZone: 'UTC' }, opts)).format(d); }
    catch (e) { return str(iso); }
  }
  function fmtRange(a, b) {
    var da = parseDate(a), db = parseDate(b);
    if (!da) return DASH;
    if (!db) return fmtDate(a, { dateStyle: 'long' });
    try {
      var f = new Intl.DateTimeFormat(state.lang, { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' });
      return f.formatRange ? f.formatRange(da, db) : f.format(da) + ' – ' + f.format(db);
    } catch (e) { return a + ' – ' + b; }
  }

  // ---------- building blocks
  function statusBadge(status, large) {
    var s = STATUS_ICON[status] ? status : 'Gray';
    var b = el('span', 'status st-' + s.toLowerCase() + (large ? ' status-large' : ''));
    var icon = el('span', 'icon', STATUS_ICON[s]);
    icon.setAttribute('aria-hidden', 'true');
    b.appendChild(icon);
    b.appendChild(el('span', null, L('status.' + slug(s))));
    return b;
  }
  function trackingBadge(tracking) {
    var key = slug(tracking || 'Not yet');
    return el('span', 'badge tr-' + key, L('tracking.' + key));
  }
  function splitLines(text) {
    return str(text).split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function lines(target, text) {
    clear(target);
    var parts = splitLines(text);
    if (!parts.length) parts = [DASH];
    parts.forEach(function (p) { target.appendChild(el('li', null, p)); });
    return parts;
  }
  // Box: first MAX_BOX_ITEMS items visible; the rest go in a "see more" <details> (hidden in print).
  function boxLines(target, text) {
    clear(target);
    var host = $(target.id + '-more');
    clear(host);
    var parts = splitLines(text);
    if (!parts.length) { target.appendChild(el('li', 'empty', DASH)); return; }
    parts.slice(0, MAX_BOX_ITEMS).forEach(function (p) { target.appendChild(el('li', null, p)); });
    var rest = parts.slice(MAX_BOX_ITEMS);
    if (!rest.length) return;
    var det = el('details', 'more');
    det.appendChild(el('summary', null, uiText('label.see_more') + ' (+' + fmtNumber(rest.length) + ')'));
    var ul = el('ul', 'lines');
    rest.forEach(function (p) { ul.appendChild(el('li', null, p)); });
    det.appendChild(ul);
    host.appendChild(det);
  }
  // Strategy text: clamped to 2 lines; the button only shows when the text is actually cut.
  function updateClamps() {
    Array.prototype.forEach.call(document.querySelectorAll('.strategy-item'), function (item) {
      var p = item.querySelector('.clamp'), btn = item.querySelector('.more-btn');
      if (!p || !btn) return;
      if (p.classList.contains('expanded')) { btn.hidden = false; return; }
      var cut = p.scrollHeight > p.clientHeight + 1;
      p.classList.toggle('is-cut', cut);
      btn.hidden = !cut;
    });
  }

  // ---------- render
  function render() {
    var d = state.data;
    if (!d) return;
    state.missing = {};
    var snap = isObj(d.snapshot) ? d.snapshot : {};
    var kpi = isObj(d.kpi) ? d.kpi : {};

    document.documentElement.lang = state.lang;
    var title = L('page.title');
    document.title = title === DASH ? 'DCTI-Institute' : title;
    $('page-title').textContent = title;

    var weekStart = snap.week_start || kpi.week_start;
    $('week-line').textContent = '';
    $('week-line').appendChild(el('strong', null, L('label.week') + ': '));
    $('week-line').appendChild(document.createTextNode(fmtRange(weekStart, kpi.week_end)));
    $('snapshot-line').textContent = L('label.snapshot_date') + ': ' + fmtDate(snap.snapshot_date, { dateStyle: 'long' });

    $('sample-banner').hidden = d.sample !== true;
    $('sample-text').textContent = L('label.sample_data');

    // controls
    $('week-label').textContent = L('label.week');
    $('lang-label').textContent = L('lang.selector_label');
    Array.prototype.forEach.call(document.querySelectorAll('.lang-group button'), function (b) {
      var code = b.getAttribute('data-lang');
      b.setAttribute('aria-pressed', code === state.lang ? 'true' : 'false');
      b.setAttribute('aria-label', L('lang.' + COL[code]));
      b.title = L('lang.' + COL[code]);
    });
    renderWeekOptions();

    // strategy
    $('strategy-title').textContent = L('label.strategy');
    var sb = $('strategy');
    clear(sb);
    var strategy = Array.isArray(d.strategy) ? d.strategy : [];
    if (!strategy.length) sb.appendChild(el('p', 'muted', DASH));
    strategy.forEach(function (s, i) {
      if (!isObj(s)) return;
      var item = el('div', 'strategy-item');
      item.appendChild(el('h3', null, labelOr('strategy.' + slug(s.topic), str(s.topic) || DASH)));
      var p = el('p', 'clamp', aiText(s, 'text') || DASH);
      p.id = 'strategy-text-' + i;
      item.appendChild(p);
      var btn = el('button', 'more-btn', uiText('label.see_more'));
      btn.type = 'button';
      btn.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-controls', p.id);
      btn.addEventListener('click', function () {
        var open = p.classList.toggle('expanded');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.textContent = uiText(open ? 'label.see_less' : 'label.see_more');
      });
      item.appendChild(btn);
      sb.appendChild(item);
    });

    // boxes (at most 3 items visible each)
    // Weeks with kpi.tasks use the task lists; older weeks keep the AI texts.
    var tasks = isObj(kpi.tasks) ? kpi.tasks : null;
    $('content').classList.toggle('has-tasks', !!tasks);   // print-only: tighter A4 layout for the task format
    $('box-executing-title').textContent = L('box.executing');
    boxLines($('box-executing'), tasks ? executingLines(tasks) : aiText(snap, 'executing_text'));
    $('box-how-title').textContent = L('box.how_its_going');
    var hs = $('box-how-status');
    clear(hs);
    hs.appendChild(statusBadge(snap.how_its_going_status || kpi.how_its_going_status, true));
    renderForced(tasks);
    boxLines($('box-how'), tasks ? (splitLines(aiText(snap, 'how_its_going_text'))[0] || '') : aiText(snap, 'how_its_going_text'));
    renderHowTasks(tasks);
    $('box-change-title').textContent = L('box.what_to_change');
    boxLines($('box-change'), tasks ? toChangeLines(tasks) : aiText(snap, 'what_to_change_text'));
    // needs from the team: one strip, only when there is something to ask
    var needs = tasks ? needsLines(tasks) : splitLines(aiText(snap, 'needs_from_team'));
    $('needs').hidden = !needs.length;
    $('needs-title').textContent = L('box.needs_from_team');

    if (tasks) needs.forEach(function (n) { needsBox.appendChild(el('span', 'needs-person', n)); });

    renderMainFunnel(kpi);

  // ---------- task boxes (kpi.tasks, workflow B)
  function shortDate(iso) { return fmtDate(iso, { day: 'numeric', month: 'short' }); }
  function taskItem(t, id) { return isObj(t.items) && isObj(t.items[id]) ? t.items[id] : {}; }
  function taskTitle(t, id) {
    var it = taskItem(t, id);
    return str(it['title_' + COL[state.lang]]).trim() || str(it.title_en_CA).trim() || str(it.title_pt_BR).trim() || str(id);
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function oneLine(s) { return str(s).replace(/\s+/g, ' ').trim(); }
  function executingLines(t) {
    var ex = isObj(t.executing) ? t.executing : {};
    var out = arr(ex.this_week).map(function (id) { return uiText('label.tasks_this_week') + ': ' + oneLine(taskTitle(t, id)); })
      .concat(arr(ex.next_week).map(function (id) { return uiText('label.tasks_next_week') + ': ' + oneLine(taskTitle(t, id)); }));
    return (out.length ? out : [uiText('label.tasks_none')]).join('\n');

  function toChangeLines(t) {

      return oneLine(taskTitle(t, id)) + (why.length ? ' (' + why.join(' · ') + ')' : '');
    });
    return (out.length ? out : [uiText('label.tasks_none')]).join('\n');
  }
  function needsLines(t) {
    return arr(t.team_needs).filter(isObj).map(function (p) {
      return str(p.person) + ': ' + arr(p.tasks).filter(isObj).map(function (x) {
        var when = x.due_date ? fill(uiText('label.task_due'), { date: shortDate(x.due_date) }) : uiText('label.task_no_due');

  function renderForced(t) {

  function plural(base, n) { return uiText(base + (n === 1 ? '_one' : '_many')); }
  function progressBar(label, pct) {

  function renderHowTasks(t) {

    box.appendChild(progressBar(uiText('label.gtm_done'), g.done_pct));

  // Main screen funnel: one card per product; Site visits -> Demo/Trial request -> Sale (revenue).
  // Value + status only (no change; no badge when Gray = no target).
  function renderMainFunnel(kpi) {
    $('main-funnel-title').textContent = L('label.funnel');
    var rows = Array.isArray(kpi.funnel) ? kpi.funnel.filter(isObj) : [];
    var products = [];

  function renderFunnel(kpi) {
    $('funnel-title').textContent = L('label.funnel');

  function funnelCell(r) {

  // ---------- hours by task: live, read-only totals (no notes, dates or single periods)
  // Loaded only when "See details" is open; any failure shows "unavailable" and never touches the rest of the page.
  var hours = { week: null, data: null, loading: false, failed: false, seq: 0 };
  function isoWeekOf(ds) {
    var p = ds.split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);
    var y = d.getUTCFullYear(), w = 1 + Math.floor((d - Date.UTC(y, 0, 1)) / 864e5 / 7);
    return y + '-W' + (w < 10 ? '0' : '') + w;
  }
  // the CALENDAR week of today (Monday to Sunday, America/Sao_Paulo), not the week shown in the dashboard
  function hoursWeekStart() {
    var today;
    try {
      var p = {};
      new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' })
        .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
      today = p.year + '-' + p.month + '-' + p.day;
    } catch (e) {
      today = new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);   // fallback: UTC-3
    }
    var a = today.split('-');
    var d = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2]));
    d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
    return d.toISOString().slice(0, 10);
  }
  // "2–8 nov" / "Nov 2–8"; across months "26 out – 1 nov" / "Oct 26 – Nov 1"
  var MONTHS_SHORT = {
    'pt-BR': ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'],
    'en-CA': ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
  };
  function hoursWeekRange(ws) {
    var a = new Date(Date.UTC(+ws.slice(0, 4), +ws.slice(5, 7) - 1, +ws.slice(8, 10)));
    var b = new Date(a.getTime() + 6 * 864e5);
    var m = MONTHS_SHORT[state.lang] || MONTHS_SHORT['en-CA'];
    var da = a.getUTCDate(), db = b.getUTCDate(), ma = m[a.getUTCMonth()], mb = m[b.getUTCMonth()];
    var pt = state.lang === 'pt-BR';
    if (ma === mb) return pt ? da + '–' + db + ' ' + ma : ma + ' ' + da + '–' + db;
    return pt ? da + ' ' + ma + ' – ' + db + ' ' + mb : ma + ' ' + da + ' – ' + mb + ' ' + db;
  }
  function loadHours() {
    var ws = hoursWeekStart();
    var week = ws ? isoWeekOf(ws) : null;
    if (week && week === hours.week && (hours.data || hours.loading)) { renderHours(); return; }
    var seq = ++hours.seq;
    hours.week = week; hours.data = null; hours.failed = !week; hours.loading = !!week;
    renderHours();
    if (!week) return;
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctrl ? window.setTimeout(function () { ctrl.abort(); }, 15000) : null;
    fetch('api/timelog-public', {
      method: 'POST', cache: 'no-store', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'public_totals', week: week }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      return res.json().then(function (d) {
        if (!res.ok || !isObj(d) || d.ok !== true || !Array.isArray(d.rows)) throw new Error('hours');
        return d;
      });
    }).then(function (d) {
      if (timer) window.clearTimeout(timer);
      if (seq !== hours.seq) return;
      hours.loading = false; hours.data = d;
      renderHours();
    }).catch(function () {
      if (timer) window.clearTimeout(timer);
      if (seq !== hours.seq) return;
      hours.loading = false; hours.failed = true;
      renderHours();
    });
  }
  function fmtHoursValue(h) {
    var n = isNum(h) ? h : 0;
    try { return new Intl.NumberFormat(state.lang, { maximumFractionDigits: 2 }).format(n) + ' h'; } catch (e) { return n + ' h'; }
  }
  function renderHours() {
    $('hours-title').textContent = uiText('label.hours_by_task');
    $('hours-note').textContent = uiText('label.hours_note');
    var ws = hoursWeekStart();
    $('hours-h-task').textContent = uiText('label.hours_task');
    $('hours-h-week').textContent = fill(uiText('label.hours_week'), { date: ws ? hoursWeekRange(ws) : DASH });
    $('hours-h-total').textContent = uiText('label.hours_to_date');
    $('hours-f-label').textContent = uiText('label.hours_sum');
    var msg = $('hours-msg'), table = $('hours-table'), body = $('hours-body');
    var d = hours.data;
    var rows = d && Array.isArray(d.rows) ? d.rows.filter(isObj) : [];
    var any = rows.some(function (r) { return isNum(r.total_hours) && r.total_hours > 0; });
    if (!d || !any) {
      table.hidden = true;
      msg.hidden = false;
      msg.textContent = hours.loading ? uiText('label.hours_loading')
        : hours.failed ? uiText('label.hours_unavailable')
        : d ? uiText('label.hours_none') : '';
      return;
    }
    msg.hidden = true;
    clear(body);
    var pt = state.lang === 'pt-BR';
    var groups = [], byKey = {};
    rows.forEach(function (r) {
      var k = r.fixed ? '~fixed' : (str(r.group) || '~other');
      if (!byKey[k]) {
        var name = r.fixed ? uiText('label.hours_fixed')
          : (str(pt ? r.group_pt : r.group_en) || str(r.group) || uiText('label.hours_other'));
        byKey[k] = { name: name, rows: [] };
        groups.push(k);
      }
      byKey[k].rows.push(r);
    });
    groups.sort(function (a, b) { return (a.charAt(0) === '~') - (b.charAt(0) === '~'); });
    groups.forEach(function (k) {
      var g = byKey[k];
      var gr = el('tr');
      var gh = el('th', 'group-row', g.name);
      gh.colSpan = 3; gh.scope = 'colgroup';
      gr.appendChild(gh);
      body.appendChild(gr);
      g.rows.forEach(function (r) {
        var tr = el('tr');
        var th = el('th', null, str(pt ? r.name_pt : r.name_en) || str(r.task_id));
        th.scope = 'row';
        if (r.status === 'pausada' || r.status === 'concluida') {
          th.appendChild(el('span', 'hours-tag', uiText(r.status === 'pausada' ? 'label.hours_paused' : 'label.hours_finished')));
        }
        tr.appendChild(th);
        [r.week_hours, r.total_hours].forEach(function (h) {
          tr.appendChild(el('td', 'num' + (isNum(h) && h > 0 ? '' : ' zero'), fmtHoursValue(h)));
        });
        body.appendChild(tr);
      });
    });
    $('hours-f-week').textContent = fmtHoursValue(d.total_week_hours);
    $('hours-f-total').textContent = fmtHoursValue(d.total_hours);
    table.hidden = false;
  }

  // ---------- notices

  // ---------- data loading
  function getJSON(path) {
    return fetch(path, { cache: 'no-cache', credentials: 'same-origin' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + path);
      return res.json();
    });
  }
  function validData(d) { return isObj(d) && (isObj(d.snapshot) || isObj(d.kpi)); }

  function chooseLang(d) {
    return normLang(param('lang')) || normLang(read('dcti_lang')) || normLang(d && d.default_language) || 'en-CA';
  }

  function loadWeek(file, isFirst) {
    return getJSON('data/' + file).then(function (d) {
      if (!validData(d)) throw new Error('invalid data');
      state.data = d;
      state.file = file;
      if (isFirst) state.lang = chooseLang(d);
      hideNotice();
      $('content').hidden = false;
      $('main').setAttribute('aria-busy', 'false');
      render();
      updateUrl();
    });
  }

  function updateUrl() {
    try {
      var u = new URL(window.location.href);
      var w = state.weeks.filter(function (x) { return x.file === state.file; })[0];
      if (w && state.weeks[0] && w.file !== state.weeks[0].file) u.searchParams.set('week', w.week_start); else u.searchParams.delete('week');
      window.history.replaceState(null, '', u.toString());
    } catch (e) { /* ignore */ }
  }

  function init() {
    state.lang = normLang(param('lang')) || normLang(read('dcti_lang')) || 'en-CA';
    document.documentElement.lang = state.lang;
    if (window.location.protocol === 'file:') { showNotice('file'); $('main').setAttribute('aria-busy', 'false'); return; }

    var wanted = str(param('week')).trim();
    if (wanted && !WEEK_RE.test(wanted)) wanted = wanted.slice(0, 40);   // shown back as text only
    getJSON('data/index.json').then(function (idx) {
      var weeks = isObj(idx) && Array.isArray(idx.weeks) ? idx.weeks : [];
      state.weeks = weeks.filter(function (w) { return isObj(w) && FILE_RE.test(str(w.file)) && parseDate(w.week_start); });
      if (!state.weeks.length) throw new Error('empty index');
      var pick = state.weeks.filter(function (w) { return w.week_start === wanted; })[0];
      return loadWeek((pick || state.weeks[0]).file, true).then(function () {
        if (wanted && !pick) showNotice('week_missing', { week: wanted });
      });
    }).catch(function () {
      // index.json missing or broken: fall back to latest.json
      state.weeks = [];
      return loadWeek('latest.json', true).then(function () {
        var shown = state.data && state.data.snapshot ? str(state.data.snapshot.week_start) : '';
        if (wanted && wanted !== shown) showNotice('week_missing', { week: wanted });
      });
    }).catch(function () {
      showNotice('load');
      $('main').setAttribute('aria-busy', 'false');
    });

    Array.prototype.forEach.call(document.querySelectorAll('.lang-group button'), function (b) {
      b.addEventListener('click', function () {
        var lg = normLang(b.getAttribute('data-lang'));
        if (!lg) return;
        state.lang = lg;
        store('dcti_lang', lg);
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.has('lang')) { u.searchParams.set('lang', lg); window.history.replaceState(null, '', u.toString()); }
        } catch (e) { /* ignore */ }
        if (state.data) render(); else document.documentElement.lang = lg;
        renderNotice();
      });
    });
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(updateClamps, 150);
    });
    $('details').addEventListener('toggle', function () { if ($('details').open && state.data) loadHours(); });
    $('week-select').addEventListener('change', function (e) {
      var file = e.target.value;
      if (!FILE_RE.test(file)) return;
      var previous = state.file;
      loadWeek(file, false).catch(function () {
        state.file = previous;
        renderWeekOptions();
        showNotice('week');
      });
    });
  }

  init();
})();
</script>
</body>
</html>
